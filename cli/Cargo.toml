[package]
name = "zenithal-cli"
version = "0.1.0"
edition = "2021"
description = "Zenithal: the `zenithal` command. Wires providers and memory into something you can run."
license = "Apache-2.0"

[[bin]]
name = "zenithal"
path = "src/main.rs"

[dependencies]
zenithal-brand = { path = "../brand" }
zenithal-providers = { path = "../providers" }
zenithal-memory = { path = "../memory" }
zenithal-agent = { path = "../agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The only I/O in the tree. Rustls rather than openssl: no system C library to find, and
# ring is already in the lockfile through the TypeDB driver.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"

[features]
# Passes through to zenithal-memory: enables the local TypeDB backend.
typedb = ["zenithal-memory/typedb"]
